name: Sync Predictive Maintenance Dashboard to Hugging Face Hub

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6          # v6 supports Node 24 [citation:13][citation:17]
        with:
          fetch-depth: 0
          lfs: true

      - name: Push clean snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions CI/CD"

          # Create a clean, history-free branch
          git checkout --orphan hf-deploy

          # Remove any cached artifacts that might still be tracked
          git rm -r --cached --ignore-unmatch xgboost_model.pkl artifacts/ runs/ || true

          # Stage only the current working tree (binary should be gone now)
          git add -A
          git commit -m "Deploy clean snapshot to HF Spaces"

          # Push to Hugging Face
          git remote add hf https://sudhakaryg:$HF_TOKEN@huggingface.co/spaces/sudhakaryg/predictive-maintenance-dashboard
          git push --force hf hf-deploy:main
